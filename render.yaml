# Render 블루프린트: Render 대시보드 > New > Blueprint 에서 이 GitHub 저장소를 고르면 서버가 만들어진다.
# 비밀값은 여기 적지 않는다(sync: false → Render 화면에서 직접 입력).
services:
  - type: web
    name: sbada-server
    runtime: docker
    rootDir: sbada-server
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: GEMMA_API_KEY
        sync: false
      - key: SBADA_CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
      - key: SBADA_AI_PROVIDER
        value: auto
