// 결제 서비스(결제 서버 :9098)가 제공한다. 메인 서버(교환)가 정산 · 환불을 부른다.
// 같은 호출이 두 번 와도 한 번만 반영한다(멱등).
syntax = "proto3";

package sbada.payment.v1;

option java_multiple_files = true;
option java_package = "com.sbada.grpc.payment.v1";

service EscrowService {
  rpc Release(EscrowCommand) returns (EscrowResult);
  rpc Refund(EscrowCommand) returns (EscrowResult);
}

message EscrowCommand {
  int64 exchange_id = 1;
  string reason = 2;
}

message EscrowResult {
  string status = 1; // HELD · RELEASED · REFUNDED
  int64 amount = 2;
  int64 fee = 3;
}
