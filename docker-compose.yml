# 스바다 MSA 를 컨테이너로 함께 띄우기: docker compose up --build   (맥에서 평소엔 .command 스크립트로 충분 — 이건 배포 · 발표용)
#  - 앱은 core(8097)만 부른다. core 가 물품 · 사진 · AI · 추천 · 찜 · /graphql 은 item(8099)으로, 결제는 payment(8098)로 넘긴다(게이트웨이).
#  - 서버끼리 직접 묻는 건 gRPC('배달부': core 9097 · payment 9098 · item 9099), 일어난 일 알리기는 Kafka('허브': kafka:9092).
#  - 세 서비스가 같은 비밀 파일(JWT 키 · 내부 토큰)을 쓰도록 secrets 볼륨을 공유한다. DB 는 각자 따로.
#  - 비밀값(GEMMA_API_KEY 등)은 여기 적지 않는다: 같은 폴더의 .env(깃에 안 올라감)나 셸 환경 변수로 넣는다.
#  - 빌드 위치는 저장소 맨 위(세 서버가 같은 sbada-proto 를 쓰므로).
x-common-env: &common
  SBADA_JWT_SECRET_FILE: /secrets/.jwt-secret
  SBADA_INTERNAL_TOKEN_FILE: /secrets/.internal-token
  SPRING_GRPC_SERVER_ADDRESS: 0.0.0.0
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  core:
    build: { context: ., dockerfile: sbada-server/Dockerfile }
    ports: ["8097:8097"]
    environment:
      <<: *common
      SBADA_SERVICES_ITEM_URL: http://item:8099
      SBADA_SERVICES_PAYMENT_URL: http://payment:8098
      SBADA_GRPC_ITEM_TARGET: item:9099
      SBADA_GRPC_PAYMENT_TARGET: payment:9098
    volumes: [shared-secrets:/secrets, core-data:/app/data]
    depends_on: [kafka]
  item:
    build: { context: ., dockerfile: sbada-item/Dockerfile }
    environment:
      <<: *common
      SBADA_CORE_URL: http://core:8097
      SBADA_GRPC_CORE_TARGET: core:9097
      SBADA_UPLOAD_DIR: /app/data/uploads
      GEMMA_API_KEY: ${GEMMA_API_KEY:-}
    volumes: [shared-secrets:/secrets, item-data:/app/data]
    depends_on: [kafka, core]
  payment:
    build: { context: ., dockerfile: sbada-payment/Dockerfile }
    environment:
      <<: *common
      SBADA_CORE_URL: http://core:8097
      SBADA_GRPC_CORE_TARGET: core:9097
    volumes: [shared-secrets:/secrets, payment-data:/app/data]
    depends_on: [kafka, core]
volumes:
  shared-secrets:
  core-data:
  item-data:
  payment-data:
