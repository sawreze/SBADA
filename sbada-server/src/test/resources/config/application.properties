# 테스트 전용(모든 테스트 공통) — 2026-11-25 MSA 2단계
# 물품 서버 · 결제 서버 대신 같은 테스트 안의 가짜 gRPC 서비스(FakeServices)를 in-process 로 부른다.
# Kafka 없이: 듣기는 끄고, 아웃박스 중계도 끈다(이벤트는 outbox_events 표에서 확인).
spring.grpc.server.port=0
spring.grpc.server.inprocess.name=main-test
sbada.grpc.item-target=in-process:main-test
sbada.grpc.payment-target=in-process:main-test
spring.kafka.listener.auto-startup=false
sbada.events.relay-enabled=false
# 배송 현황 조회 · 7일 만료 예약 작업은 테스트에서 끄고, 테스트가 직접 부른다
sbada.shipping.scheduler-enabled=false
