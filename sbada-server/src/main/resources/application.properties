spring.application.name=sbada-server

# 7장과 같은 규칙: 이 PC에서만 연다. 에뮬레이터는 10.0.2.2:8097 로 접속한다.
server.port=8097
server.address=127.0.0.1

# 비밀값(Gemma API 키 등)은 이 파일이 아니라 Git에 올라가지 않는 application-local.properties 에 둔다.
spring.config.import=optional:file:./application-local.properties

# H2 파일 DB (서버를 껐다 켜도 데이터 유지)
spring.datasource.url=jdbc:h2:file:./data/sbada;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
# 테이블은 Flyway(db/migration/V*.sql)가 만들고 바꾼다. JPA는 엔티티와 테이블이 맞는지 확인만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Flyway: V1 = 테이블 12개, V2 = 시연용 초기 데이터(계정 4명·물건 16개·교환 요청 1건)
#  - 빈 DB → V1, V2 를 차례로 적용
#  - Flyway 이전(ddl-auto=update 시절)에 만든 DB → 이미 V2 까지 있는 것으로 보고(baseline) 내용은 건드리지 않음
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
# 목록에서 사진·희망 카테고리를 한 번에 묶어 읽어 N+1 쿼리를 줄인다
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# 서버가 정하는 값(가격·상태·등록자)을 본문에 넣으면 400 (7장 P05 규칙)
spring.jackson.deserialization.fail-on-unknown-properties=true

# 사진 업로드는 물품 서버가 받는다(2026-11-25 MSA 2단계). 메인 서버는 multipart 를 해석하지 않고 바이트 그대로 넘긴다
spring.servlet.multipart.enabled=false

# JWT (HS256, 키는 처음 실행 때 data/.jwt-secret 에 32바이트 난수로 만든다)
sbada.jwt.issuer=sbada
sbada.jwt.ttl-seconds=7200
# 로그인 화면 '로그인 유지' 체크 시 토큰 유효 시간(30일)
sbada.jwt.remember-ttl-seconds=2592000
sbada.jwt.secret-file=./data/.jwt-secret

# ===== MSA 2단계(2026-11-25): 서버 3개 + 배달부(gRPC) + 허브(Kafka) =====
# 물품 서버(sbada-item): HTTP 8099(게이트웨이가 /api/items/** · /graphql 등을 넘김), gRPC 9099(물건 요약 · 교환 성사)
sbada.services.item.url=http://127.0.0.1:8099
sbada.grpc.item-target=127.0.0.1:9099
# 결제 서버 gRPC 9098(안전결제 정산 · 환불)
sbada.grpc.payment-target=127.0.0.1:9098
# 이 서버가 제공하는 배달부: UserService(회원 · 추천 맥락) · ExchangeService(추가 금액 조건) — 9097
spring.grpc.server.port=9097
spring.grpc.server.address=127.0.0.1
# 허브(Kafka): 아웃박스 → Kafka, 그리고 item · notifications · payment 이벤트 듣기
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.consumer.group-id=sbada-server
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false
sbada.events.relay-delay-ms=1000

# ===== MSA: 결제 마이크로서비스(sbada-payment, 포트 8098) =====
# 앱은 이 서버(8097)로만 요청하고, /api/wallet/** · /api/payments/** 는 게이트웨이(PaymentGatewayController)가 결제 서비스로 넘긴다.
sbada.services.payment.url=http://127.0.0.1:8098
# 서비스끼리 내부 API(/internal/**)를 부를 때 쓰는 비밀 토큰 파일(결제 서비스와 공유, 깃에 올라가지 않음)
sbada.internal.token-file=./data/.internal-token

# 시연용 표본 사진을 넣어 두는 폴더(물품 서버가 같은 폴더를 읽는다: sbada-item 의 sbada.upload.dir)
sbada.upload.dir=./data/uploads
# 시연용 표본 사진(seed-s01.jpg ~ seed-s16.jpg)을 업로드 폴더에 복사할지(행은 Flyway V2 가 넣는다)
sbada.seed.enabled=true

# 지도 (카카오맵 JavaScript SDK, 앱의 WebView 에서 사용)
#  키는 Git 에 올라가지 않는 application-local.properties 에 sbada.map.kakao-js-key=... 로 넣는다(또는 환경 변수 KAKAO_JS_KEY).
#  비어 있으면 앱은 직접 그린 약도를 보여 준다.
# 지도 종류: osm(기본, OpenStreetMap · 키 · 요금 없음) 또는 kakao(유료 · 콘솔에서 카카오맵 사용 설정 필요)
sbada.map.provider=osm
sbada.map.kakao-js-key=${KAKAO_JS_KEY:}

# 카카오 로그인 (POST /api/auth/kakao)
#  카카오 콘솔 > 내 애플리케이션 > 앱 정보의 '앱 ID'(숫자). 앱이 보낸 카카오 토큰이 이 앱의 것인지 확인하는 데 쓴다.
#  application-local.properties 에 sbada.auth.kakao.app-id=... 로 넣는다(또는 환경 변수 KAKAO_APP_ID). 비어 있으면 카카오 로그인은 503.
sbada.auth.kakao.app-id=${KAKAO_APP_ID:}

# AI 가격 분석(Gemma)은 물품 서버로 옮겼다(2026-11-25). 키는 지금처럼 이 폴더의 application-local.properties 에 두면
# 물품 서버가 함께 읽는다(sbada-item: spring.config.import=../sbada-server/application-local.properties).

# FCM 푸시 (앱이 꺼져 있을 때). 서비스 계정 JSON 경로를 application-local.properties 에 넣고 true로 바꾼다.
sbada.push.fcm.enabled=false
sbada.push.fcm.service-account-file=${FCM_SERVICE_ACCOUNT_FILE:}
# APNs 직접 푸시(아이폰, Firebase 없이). .p8 키 경로 · 키 ID · 팀 ID 는 application-local.properties 에만(공개 금지)
sbada.push.apns.enabled=false
sbada.push.apns.key-file=${APNS_KEY_FILE:}
sbada.push.apns.key-id=${APNS_KEY_ID:}
sbada.push.apns.team-id=${APNS_TEAM_ID:}
sbada.push.apns.bundle-id=com.sbada.sbada
sbada.push.apns.sandbox=true

# 시연용 예외: 여기 적힌 아이디가 '바로 바꾸기'를 보내면 상대의 수락 없이 바로 교환 성사(쉼표로 여러 개).
#  발표 시연을 빠르게 하려고 admin 계정만 넣어 둠. 비우면(sbada.demo.instant-exchange-users=) 모두 원래대로 '상대가 수락해야 성사'
sbada.demo.instant-exchange-users=admin

# 다른 주소의 웹 화면(Vercel 등)에서 API 를 부를 수 있게 허용할 주소(CORS). 비우면 끔(내 PC 는 /app/ 같은 주소라 필요 없음)
#  클라우드(Render)에서는 환경 변수 SBADA_CORS_ALLOWED_ORIGINS=https://*.vercel.app 로 넣는다
sbada.cors.allowed-origins=${SBADA_CORS_ALLOWED_ORIGINS:}
