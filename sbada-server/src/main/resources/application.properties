spring.application.name=sbada-server

# 7장과 같은 규칙: 이 PC에서만 연다. 에뮬레이터는 10.0.2.2:8097 로 접속한다.
server.port=8097
server.address=127.0.0.1

# 비밀값(Gemma API 키 등)은 이 파일이 아니라 Git에 올라가지 않는 application-local.properties 에 둔다.
spring.config.import=optional:file:./application-local.properties

# H2 파일 DB (서버를 껐다 켜도 데이터 유지)
spring.datasource.url=jdbc:h2:file:./data/sbada;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
# 테이블은 Flyway(db/migration/V*.sql)가 만들고 바꾼다. JPA는 엔티티와 테이블이 맞는지 확인만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Flyway: V1 = 테이블 12개, V2 = 시연용 초기 데이터(계정 4명·물건 16개·교환 요청 1건)
#  - 빈 DB → V1, V2 를 차례로 적용
#  - Flyway 이전(ddl-auto=update 시절)에 만든 DB → 이미 V2 까지 있는 것으로 보고(baseline) 내용은 건드리지 않음
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
# 목록에서 사진·희망 카테고리를 한 번에 묶어 읽어 N+1 쿼리를 줄인다
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# 서버가 정하는 값(가격·상태·등록자)을 본문에 넣으면 400 (7장 P05 규칙)
spring.jackson.deserialization.fail-on-unknown-properties=true

# 사진 업로드 제한 (파일 5 MiB, 요청 전체 6 MiB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT (HS256, 키는 처음 실행 때 data/.jwt-secret 에 32바이트 난수로 만든다)
sbada.jwt.issuer=sbada
sbada.jwt.ttl-seconds=7200
sbada.jwt.secret-file=./data/.jwt-secret

sbada.upload.dir=./data/uploads
# 시연용 표본 사진(seed-s01.jpg ~ seed-s16.jpg)을 업로드 폴더에 복사할지(행은 Flyway V2 가 넣는다)
sbada.seed.enabled=true

# 지도 (카카오맵 JavaScript SDK, 앱의 WebView 에서 사용)
#  키는 Git 에 올라가지 않는 application-local.properties 에 sbada.map.kakao-js-key=... 로 넣는다(또는 환경 변수 KAKAO_JS_KEY).
#  비어 있으면 앱은 직접 그린 약도를 보여 준다.
# 지도 종류: osm(기본, OpenStreetMap · 키 · 요금 없음) 또는 kakao(유료 · 콘솔에서 카카오맵 사용 설정 필요)
sbada.map.provider=osm
sbada.map.kakao-js-key=${KAKAO_JS_KEY:}

# 카카오 로그인 (POST /api/auth/kakao)
#  카카오 콘솔 > 내 애플리케이션 > 앱 정보의 '앱 ID'(숫자). 앱이 보낸 카카오 토큰이 이 앱의 것인지 확인하는 데 쓴다.
#  application-local.properties 에 sbada.auth.kakao.app-id=... 로 넣는다(또는 환경 변수 KAKAO_APP_ID). 비어 있으면 카카오 로그인은 503.
sbada.auth.kakao.app-id=${KAKAO_APP_ID:}

# AI 가격 분석 (Gemma)
#  auto     : Google AI Studio 키가 있으면 google → 없으면 로컬 ollama → 둘 다 실패하면 fallback
#  google   : Gemini API로 Gemma 4 호출 (GEMMA_API_KEY 필요)
#  ollama   : 내 PC의 Ollama 에서 gemma4 실행
#  fallback : AI 없이 카테고리·상태 기준가로 추정 (오프라인 시연용)
sbada.ai.provider=auto
sbada.ai.google.api-key=${GEMMA_API_KEY:}
sbada.ai.google.model=gemma-4-26b-a4b-it
sbada.ai.ollama.url=http://127.0.0.1:11434
sbada.ai.ollama.model=gemma4:e4b
sbada.ai.timeout-seconds=90

# FCM 푸시 (앱이 꺼져 있을 때). 서비스 계정 JSON 경로를 application-local.properties 에 넣고 true로 바꾼다.
sbada.push.fcm.enabled=false
sbada.push.fcm.service-account-file=${FCM_SERVICE_ACCOUNT_FILE:}

# 시연용 예외: 여기 적힌 아이디가 '바로 바꾸기'를 보내면 상대의 수락 없이 바로 교환 성사(쉼표로 여러 개).
#  발표 시연을 빠르게 하려고 admin 계정만 넣어 둠. 비우면(sbada.demo.instant-exchange-users=) 모두 원래대로 '상대가 수락해야 성사'
sbada.demo.instant-exchange-users=admin

# 다른 주소의 웹 화면(Vercel 등)에서 API 를 부를 수 있게 허용할 주소(CORS). 비우면 끔(내 PC 는 /app/ 같은 주소라 필요 없음)
#  클라우드(Render)에서는 환경 변수 SBADA_CORS_ALLOWED_ORIGINS=https://*.vercel.app 로 넣는다
sbada.cors.allowed-origins=${SBADA_CORS_ALLOWED_ORIGINS:}
