# ===== 스바다 물품 마이크로서비스 (MSA 2단계, 2026-11-25) =====
# 물건 · 사진 · AI 가격 분석 · 추천 · 찜. 앱은 메인 서버(8097)로만 요청하고 게이트웨이가 여기로 넘긴다.
spring.application.name=sbada-item
server.port=8099
server.address=127.0.0.1

# 비밀값(Gemma API 키 등)은 Git 에 올라가지 않는 파일에만. 메인 서버에 이미 넣어 둔 키를 그대로 쓰고, 여기 것이 있으면 우선
spring.config.import=optional:file:../sbada-server/application-local.properties,optional:file:./application-local.properties

# 물품 서비스만의 DB(메인 서버 DB 와 분리 = Database per Service)
spring.datasource.url=jdbc:h2:file:./data/item;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jackson.deserialization.fail-on-unknown-properties=true

# 사진: 메인 서버가 쓰던 폴더를 그대로 쓴다(이미 올라간 사진 · 시연 사진이 그 자리에 있음)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
sbada.upload.dir=../sbada-server/data/uploads

# 로그인 토큰: 메인 서버(회원 서비스)가 발급한 JWT 를 같은 키 파일로 검증만 한다
sbada.jwt.issuer=sbada
sbada.jwt.ttl-seconds=7200
sbada.jwt.secret-file=../sbada-server/data/.jwt-secret
# 서비스끼리 비밀 토큰(gRPC 메타데이터 x-internal-token, 메인 · 결제 서버와 같은 파일)
sbada.internal.token-file=../sbada-server/data/.internal-token

# ===== 배달부(gRPC) =====
# 이 서버가 제공: ItemService(물건 요약 · 교환 성사 · 사진 확인) — 메인 서버가 부른다
spring.grpc.server.port=9099
spring.grpc.server.address=127.0.0.1
# 이 서버가 부르는 곳: 메인 서버의 UserService(회원 · 추천 맥락)
sbada.grpc.core-target=127.0.0.1:9097

# ===== 허브(Kafka) =====
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=sbada-item
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false
# Kafka 가 꺼져 있어도 서버는 뜨고, 보낼 이벤트는 아웃박스에 쌓였다가 켜지면 나간다
spring.kafka.producer.properties.max.block.ms=3000
sbada.events.relay-delay-ms=1000

# 처음 켤 때 메인 서버 DB 에 있던 물건 · 사진 · 찜 · AI 분석을 가져온다(물품 DB 가 비어 있을 때 한 번만)
sbada.item.import.enabled=true
sbada.core.url=http://127.0.0.1:8097

# AI 가격 분석 (메인 서버에서 옮김. 키는 application-local.properties)
sbada.ai.provider=auto
sbada.ai.google.api-key=${GEMMA_API_KEY:}
sbada.ai.google.model=gemma-4-26b-a4b-it
sbada.ai.ollama.url=http://127.0.0.1:11434
sbada.ai.ollama.model=gemma4:e4b
sbada.ai.timeout-seconds=90

# GraphQL: POST /graphql (물건 목록 조회). 스키마는 resources/graphql/*.graphqls
spring.graphql.http.path=/graphql
spring.graphql.schema.printer.enabled=true

sbada.cors.allowed-origins=${SBADA_CORS_ALLOWED_ORIGINS:}
