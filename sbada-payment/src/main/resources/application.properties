# ===== 스바다 결제 마이크로서비스 (시연용: 실제 돈은 움직이지 않는다) =====
spring.application.name=sbada-payment
server.port=8098
server.address=127.0.0.1
# 비밀값(토스 테스트 키 등)은 Git 에서 빠지는 이 파일에서 읽는다 — 결제_택배_키_설정.command 가 만든다
spring.config.import=optional:file:./application-local.properties

# 결제 서비스만의 DB(메인 서버 DB와 분리 = Database per Service)
spring.datasource.url=jdbc:h2:file:./data/payment;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# 로그인 토큰: 메인 서버(회원 서비스)가 발급한 JWT 를 같은 키 파일로 검증만 한다
sbada.jwt.secret-file=../sbada-server/data/.jwt-secret
sbada.jwt.issuer=sbada

# 서비스끼리 내부 통신용 비밀 토큰(메인 서버와 같은 파일을 공유. 깃에 올라가지 않는 data/ 폴더)
sbada.internal.token-file=../sbada-server/data/.internal-token

# 메인 서버 주소: 받는 사람이 실제 회원인지 · 교환 조건 확인(배달부 gRPC), 예전 HTTP 이벤트 주소
sbada.core.url=http://127.0.0.1:8097
sbada.core.verify-users=true
sbada.events.relay-delay-ms=1500

# ===== MSA 2단계(2026-11-25): 배달부(gRPC) + 허브(Kafka) =====
# 이 서버가 제공: EscrowService(정산 · 환불) — 메인 서버가 부른다
spring.grpc.server.port=9098
spring.grpc.server.address=127.0.0.1
# 이 서버가 부르는 곳: 메인 서버의 UserService · ExchangeService
sbada.grpc.core-target=127.0.0.1:9097
# 결제 이벤트(출금됨 · 결제됨 · 정산 · 환불)는 허브(Kafka sbada.payment.events)로. http 로 바꾸면 예전처럼 메인 서버에 직접
sbada.events.transport=kafka
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000

# 계좌번호 암호화 키(RSA-3072 개인키 · 공개키 · HMAC 키)를 두는 곳. DB 와 다른 곳 + gitignore 된 data/ 폴더
sbada.wallet.key-dir=./data/keys

# 시연 설정: 처음 지갑을 열면 시연용 잔액을 넣어 준다. 추가 요금 수수료는 5%(보내는 사람이 부담)
sbada.wallet.demo-initial-balance=100000
sbada.wallet.fee-percent=5
sbada.wallet.min-amount=1000
sbada.wallet.max-amount=1000000
sbada.wallet.max-accounts=5

# ===== 2026-11-25 금융 백엔드: 안전결제(에스크로) · 1원 인증 · 샌드박스 =====
# 샌드박스: 실제 돈은 움직이지 않는다(실제 PG · 은행 API 호출 코드 없음 → 전자금융 규제 없이 흐름 전체를 시험 가능).
#  true 면 1원 인증 숫자를 응답(demoMemo)에도 보여 주고, POST /api/wallet/sandbox/reset(테스트 잔액 초기화)을 쓸 수 있다.
sbada.payment.sandbox=true
# 교환이 성사된 뒤 확정이 없으면 자동 정산하기까지의 시간(분).
#  2026-11-25: 이제 메인 서버가 두 물건의 배송 완료를 확인하면 정산하고, 운송장 7일 만료면 환불한다.
#  자동 정산은 그 둘이 모두 안 된 경우의 마지막 안전장치라 30일로 늘림(예전 72시간이면 배송 전에 정산될 수 있었다)
sbada.escrow.auto-release-minutes=43200
# 보관 중인 안전결제를 메인 서버와 맞춰 보는 주기(ms): 환불 호출이 유실돼도 여기서 다시 환불한다
sbada.escrow.sweep-delay-ms=60000

# ===== 2026-11-25 토스페이먼츠(테스트 키만) =====
# 키는 여기에 적지 않는다: Git 에서 빠지는 ./application-local.properties (결제_택배_키_설정.command 가 만든다)
#  sbada.toss.client-key=test_ck_…   sbada.toss.secret-key=test_sk_…   (live_ 키는 TossClient 가 거절)
# 가상계좌 입금 확인: 토스 웹훅(POST /api/payments/toss/webhook)이 와도 되고, 못 받는 환경(맥 로컬)을 위해 이 간격(ms)으로 토스에 다시 묻는다
sbada.toss.poll-ms=60000
# 가상계좌 입금 기한(시간)
sbada.toss.va-valid-hours=24
