# ===== 스바다 결제 마이크로서비스 (시연용: 실제 돈은 움직이지 않는다) =====
spring.application.name=sbada-payment
server.port=8098
server.address=127.0.0.1

# 결제 서비스만의 DB(메인 서버 DB와 분리 = Database per Service)
spring.datasource.url=jdbc:h2:file:./data/payment;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# 로그인 토큰: 메인 서버(회원 서비스)가 발급한 JWT 를 같은 키 파일로 검증만 한다
sbada.jwt.secret-file=../sbada-server/data/.jwt-secret
sbada.jwt.issuer=sbada

# 서비스끼리 내부 통신용 비밀 토큰(메인 서버와 같은 파일을 공유. 깃에 올라가지 않는 data/ 폴더)
sbada.internal.token-file=../sbada-server/data/.internal-token

# 메인 서버 주소: 이벤트(출금됨 · 결제됨)를 보내 알림을 띄우고, 받는 사람이 실제 회원인지 확인한다
sbada.core.url=http://127.0.0.1:8097
sbada.core.verify-users=true
sbada.events.relay-delay-ms=1500

# 계좌번호 암호화 키(RSA-3072 개인키 · 공개키 · HMAC 키)를 두는 곳. DB 와 다른 곳 + gitignore 된 data/ 폴더
sbada.wallet.key-dir=./data/keys

# 시연 설정: 처음 지갑을 열면 시연용 잔액을 넣어 준다. 추가 요금 수수료는 5%(보내는 사람이 부담)
sbada.wallet.demo-initial-balance=100000
sbada.wallet.fee-percent=5
sbada.wallet.min-amount=1000
sbada.wallet.max-amount=1000000
sbada.wallet.max-accounts=5
